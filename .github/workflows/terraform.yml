# fmt, validate, lint y plan en cada PR que toque la infraestructura.
#
# El plan corre en uno de dos modos, según lo que esté configurado en el repo:
#
#   offline  (por defecto)  Sin credenciales de GCP. El backend se reemplaza
#                           por uno local y el plan muestra qué se crearía
#                           desde cero. Valida que el código planea, no el
#                           diff contra la infraestructura real.
#
#   real                    Con las variables GCP_WIF_PROVIDER, GCP_SA_PLAN,
#                           TF_STATE_BUCKET y TF_PROJECT_<ENTORNO> definidas.
#                           Entra a GCP por Workload Identity Federation —sin
#                           claves JSON— con una identidad que solo puede leer.
#
# Este workflow NUNCA aplica cambios. El apply es manual y lo hace una persona
# mirando el plan (ver README).

name: terraform

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.tftpl'
      - '**/.terraform.lock.hcl'
      - '.tflint.hcl'
      - 'ci/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.tftpl'
      - '**/.terraform.lock.hcl'
      - '.tflint.hcl'
      - 'ci/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_VERSION: 1.16.6
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  formato:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        # -diff muestra exactamente qué línea está mal formateada: el error se
        # arregla leyendo el log, sin tener que reproducirlo localmente.
        run: terraform fmt -check -recursive -diff

  lint:
    name: tflint + trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: Inicializar plugins de tflint
        env:
          # Bajar el ruleset de Google usa la API de GitHub; con token no
          # choca contra el límite de 60 pedidos por hora de las llamadas anónimas.
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init

      - name: Lint de cada raíz y módulo
        run: |
          estado=0
          for dir in envs/dev envs/prod bootstrap modules/*; do
            echo "::group::${dir}"
            tflint --chdir="${dir}" --config="${GITHUB_WORKSPACE}/.tflint.hcl" --format=compact || estado=1
            echo "::endgroup::"
          done
          exit "${estado}"

      - name: Configuración insegura (Trivy)
        # Bloquea solo HIGH y CRITICAL. El único hallazgo actual es LOW
        # (GCP-0066, bucket sin CMEK) y está aceptado con motivo en el README.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  plan:
    name: validate + plan (${{ matrix.entorno }})
    needs: formato
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        entorno: [dev, prod]

    permissions:
      contents: read
      id-token: write       # token OIDC para Workload Identity Federation (modo real)
      pull-requests: write  # comentar el plan en el PR

    defaults:
      run:
        working-directory: envs/${{ matrix.entorno }}

    env:
      ENTORNO: ${{ matrix.entorno }}
      # Modo real solo si el repo tiene configurada la federación.
      MODO: ${{ vars.GCP_WIF_PROVIDER != '' && 'real' || 'offline' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # Sin el wrapper: la salida de terraform llega tal cual a los
          # archivos, sin las líneas de debug que agrega.
          terraform_wrapper: false

      - name: terraform validate
        run: |
          terraform init -backend=false -no-color > /dev/null
          terraform validate -no-color

      - name: Autenticar en GCP (modo real)
        if: env.MODO == 'real'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_PLAN }}

      - name: Inicializar backend
        env:
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ "${MODO}" = "real" ]; then
            terraform init -reconfigure -no-color -backend-config="bucket=${BUCKET}"
          else
            # *_override.tf se aplica después del resto: el backend gcs pasa
            # a ser local solo dentro de este runner.
            cp "${GITHUB_WORKSPACE}/ci/backend_override.tf" .
            terraform init -reconfigure -no-color
          fi

      - name: terraform plan
        id: plan
        env:
          PROYECTO_DEV: ${{ vars.TF_PROJECT_DEV }}
          PROYECTO_PROD: ${{ vars.TF_PROJECT_PROD }}
        run: |
          set +e
          if [ "${MODO}" = "real" ]; then
            if [ "${ENTORNO}" = "dev" ]; then PROYECTO="${PROYECTO_DEV}"; else PROYECTO="${PROYECTO_PROD}"; fi
            terraform plan -no-color -detailed-exitcode -lock-timeout=60s \
              -var="project_id=${PROYECTO}" -out=tfplan > plan.txt 2>&1
          else
            # El provider de Google exige *alguna* credencial para inicializarse.
            # Este valor no es un secreto ni da acceso a nada: con -refresh=false
            # y un state vacío, el plan no hace ninguna llamada a la API.
            GOOGLE_OAUTH_ACCESS_TOKEN=plan-offline-sin-credenciales \
              terraform plan -no-color -detailed-exitcode -refresh=false -lock=false \
              -out=tfplan > plan.txt 2>&1
          fi
          codigo=$?
          set -e

          # -detailed-exitcode: 0 = sin cambios, 2 = hay cambios, 1 = error.
          # Un 2 no es una falla: es justamente lo que un PR viene a proponer.
          echo "codigo=${codigo}" >> "${GITHUB_OUTPUT}"
          cat plan.txt
          if [ "${codigo}" -eq 1 ]; then exit 1; fi

          resumen="$(grep -E '^(Plan:|No changes\.)' plan.txt || true)"
          echo "resumen=${resumen}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Plan \`${ENTORNO}\` — modo ${MODO}"
            echo
            echo "${resumen}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Comentar el plan en el PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESUMEN: ${{ steps.plan.outputs.resumen }}
        with:
          script: |
            const fs = require('fs')
            const { ENTORNO, MODO, RESUMEN } = process.env
            const marca = `<!-- terraform-plan-${ENTORNO} -->`

            // Un comentario de GitHub admite 65.536 caracteres: si el plan es
            // más largo, se recorta con aviso en vez de fallar el job.
            let plan = fs.readFileSync(`envs/${ENTORNO}/plan.txt`, 'utf8')
            const LIMITE = 60000
            if (plan.length > LIMITE) plan = plan.slice(0, LIMITE) + '\n\n… recortado: el plan completo está en el log del job.'

            const aviso = MODO === 'offline'
              ? '> Plan **offline**: sin credenciales de GCP, contra un state vacío. Muestra qué se crearía desde cero, no el diff contra la infraestructura real.'
              : '> Plan **real** contra GCP, con el state remoto del bucket.'

            const cuerpo = [
              marca,
              `### Terraform plan — \`${ENTORNO}\``,
              '',
              aviso,
              '',
              `**${RESUMEN}**`,
              '',
              '<details><summary>Ver el plan completo</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
            ].join('\n')

            // Se actualiza el comentario anterior del mismo entorno en vez de
            // sumar uno nuevo por cada push al PR.
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comentarios = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const previo = comentarios.find((c) => c.body.includes(marca))
            if (previo) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previo.id, body: cuerpo })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: cuerpo })
            }
